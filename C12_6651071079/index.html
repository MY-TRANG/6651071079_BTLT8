<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>D CODE SHOW</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
    </style>
</head>

<body>
    <h4>Checkbox Div Hide Show</h4>

    <div class="checkbox-card">
        <label for="">Do You have Passport</label>
        <div class="checkbox">
            <label>
                <input type="checkbox" class="checkme">Yes
            </label>
        </div>
        <div class="passport-box">
            <input type="text" placeholder="Enter Passport Number" class="form-control">
        </div>
        <div class="apply-box">
            <a href="">Apply For Passport</a>
        </div>
    </div>
    <br>
    <div class="checkbox-card">
        <label for="">Do You have Credit Card</label>
        <div class="checkbox">
            <label>
                <input type="checkbox" class="checkme">Yes
            </label>
        </div>
        <div class="passport-box">
            <input type="text" placeholder="Enter Credit Card Number" class="form-control">
        </div>
        <div class="apply-box">
            <a href="">Apply For Credit Card</a>
        </div>
    </div>

    <script src="js/jquery-4.0.0.min.js"></script>
    
    <form>
        
        <div>
            <label>Bạn có Passport không?</label><br>
            <label><input type="radio" name="hasPassport" value="yes"> Yes</label>
            <label><input type="radio" name="hasPassport" value="no" checked> No</label>
        </div>
        
        <div id="passportField" class="hidden-field">
            <label for="passportInput">Nhập thông tin Passport:</label>
            <input type="text" id="passportInput" name="passportInfo" placeholder="Số passport...">
        </div>
    
        <br>
    
       
        <div>
            <label>Bạn có Credit Card không?</label><br>
            <label><input type="radio" name="hasCreditCard" value="yes"> Yes</label>
            <label><input type="radio" name="hasCreditCard" value="no" checked> No</label>
        </div>
        
        <div id="creditCardField" class="hidden-field">
            <label for="creditCardInput">Nhập thông tin Credit Card:</label>
            <input type="text" id="creditCardInput" name="creditCardInfo" placeholder="Số thẻ tín dụng...">
        </div>
    </form>
    
   
    <script>
        $(document).ready(function () {
            
            $('input[name="hasPassport"]').on('change', function () {
                if ($(this).val() === 'yes' && $(this).is(':checked')) {
                    $('#passportField').slideDown(); 
                } else {
                    $('#passportField').slideUp();   
                    $('#passportInput').val('');     
                }
            });

            
            $('input[name="hasCreditCard"]').on('change', function () {
                if ($(this).val() === 'yes' && $(this).is(':checked')) {
                    $('#creditCardField').slideDown(); 
                } else {
                    $('#creditCardField').slideUp();   
                    $('#creditCardInput').val('');     
                }
            });
        });
    </script>
</body>

</html>
